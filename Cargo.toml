[package]
name = "nit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
git2 = "0.20.4"
octocrab = "0.49.7"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
similar = "2"
sublime-color-scheme = "0.1.5"
syntect = "5.3.0"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros"] }
toml = "1.1.1"

[dev-dependencies]
tempfile = "3"
insta = "1"
